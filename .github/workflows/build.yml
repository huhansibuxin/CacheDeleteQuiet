name: Build CacheDeleteQuiet

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        variant: [rootless, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rootless uses upstream theos; roothide REQUIRES the roothide fork,
      # upstream theos does not know the roothide package scheme.
      - name: Setup Theos (Rootless)
        if: matrix.variant == 'rootless'
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Setup Theos (Roothide)
        if: matrix.variant == 'roothide'
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Verify source discipline (no Logos / no substrate hooks)
        run: |
          if grep -nE '^[[:space:]]*%(hook|ctor|orig|log|new|end|group)' Tweak.xm; then
            echo "::error::Tweak.xm must stay pure objc/runtime (no Logos directives)"
            exit 1
          fi
          if grep -n 'MSHookFunction\|SubstrateHook' Tweak.xm; then
            echo "::error::Tweak.xm must not call substrate hooks"
            exit 1
          fi
          echo "OK: pure objc/runtime source"
          grep -c 'Executables' CacheDeleteQuiet.plist
          grep 'CacheDeleteAppContainerCaches' CacheDeleteQuiet.plist

      - name: Build
        run: make package

      # This is a launchd XPC helper. Any substrate/ellekit/UIKit link means
      # either a silent dlopen failure or a heavy framework dragged into a
      # small daemon. Fail the build instead.
      - name: Verify dylib dependency hygiene
        run: |
          DYLIB=$(find .theos -name 'CacheDeleteQuiet.dylib' -type f -not -path '*.dSYM*' | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::CacheDeleteQuiet.dylib not found"
            exit 1
          fi
          echo "== $DYLIB =="
          otool -L "$DYLIB"
          # The first line is the image path. Roothide also emits the dylib's
          # OWN install name (@loader_path/.jbroot/Library/MobileSubstrate/...);
          # that is a self reference, not a substrate link - exclude it or the
          # check false-positives on the "MobileSubstrate" path component.
          # Also exclude the *.dSYM DWARF copies.
          DEPS=$(otool -L "$DYLIB" | tail -n +2 | grep -v '@loader_path' || true)
          echo "== real dependencies =="; echo "$DEPS"
          if echo "$DEPS" | grep -qiE 'substrate|ellekit|UIKit'; then
            echo "::error::CacheDeleteQuiet.dylib links substrate/ellekit/UIKit"
            exit 1
          fi
          echo "OK: dependency hygiene (no Foundation/UIKit/substrate)"

      - name: Verify QUIET build contents
        run: |
          DYLIB=$(find .theos -name 'CacheDeleteQuiet.dylib' -type f -not -path '*.dSYM*' | head -1)
          STRINGS=$(strings -a "$DYLIB")
          for NEEDLE in \
            'CacheDeleteQuiet 1.2.0 QUIET' \
            '_fast_size_directory' \
            '_traverse_directory' \
            '_traverse_dir_with_state' \
            '_CacheDeleteCopyItemizedPurgeableSpaceWithInfo' \
            '_statfs' \
            '_CacheManagementEnumerateAssets' \
            '_CacheManagementRemove' \
            'REBIND' \
            'CSTAT' \
            'CTIME' \
            'enumerateBundlesOfType:block:' \
            'cacheDeleteManagedAssetsWithInfo:atUrgency:' \
            'purgeAssets:testObject:' \
            'periodic:' \
            'pruneContainerTmps' \
            'LSApplicationWorkspace' \
            'PROBE_ONLY' \
            'PASSTHROUGH_ALL' \
            'STRICT' \
            'DISABLED' \
            'quiet.log'; do
            if ! echo "$STRINGS" | grep -qF "$NEEDLE"; then
              echo "::error::required string missing from dylib: $NEEDLE"
              exit 1
            fi
          done
          echo "OK: build tag + all 5 hooks + 4 flags + log path present"
          for FORBIDDEN in \
            'MSHookFunction' \
            'logos' \
            'UIApplication' \
            'planC3.log' \
            'probe.log'; do
            if echo "$STRINGS" | grep -qiF "$FORBIDDEN"; then
              echo "::error::unexpected diagnostic/heavy dependency in dylib: $FORBIDDEN"
              exit 1
            fi
          done
          echo "OK: no Logos runtime, no UIKit, no stale probe logs"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CacheDeleteQuiet-${{ matrix.variant }}
          path: packages/*.deb
